<header class="head">
  <drinkit-venue-brand [venue]="venueSlug()" context="Administración" />

  <div class="account">
    <button
      class="chip"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="accountOpen()"
      (click)="toggleAccount()"
    >
      <svg
        class="chip-icon"
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>{{ username() }} · {{ roleName() }}</span>
    </button>

    @if (accountOpen()) {
      <div class="popover" role="menu">
        <button class="menu-item" type="button" role="menuitem" (click)="leave()">Salir</button>
      </div>
    }
  </div>

  <button
    class="burger"
    type="button"
    aria-label="Menú"
    aria-controls="admin-navigation"
    [attr.aria-expanded]="navigationOpen()"
    (click)="toggleNavigation()"
  >
    <svg
      aria-hidden="true"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>
</header>

<nav
  id="admin-navigation"
  class="tabs"
  [class.tabs-open]="navigationOpen()"
  aria-label="Administración"
>
  <a
    class="tab"
    routerLinkActive="tab-on"
    ariaCurrentWhenActive="page"
    [routerLink]="['/', venueSlug(), 'staff', 'products']"
    (click)="closeNavigation()"
  >
    Productos
  </a>
  <a
    class="tab"
    routerLinkActive="tab-on"
    ariaCurrentWhenActive="page"
    [routerLink]="['/', venueSlug(), 'staff', 'users']"
    (click)="closeNavigation()"
  >
    Usuarios internos
  </a>
</nav>
