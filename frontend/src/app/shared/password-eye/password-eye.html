<button
  class="peek"
  type="button"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <svg
    width="21"
    height="21"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
    <circle cx="12" cy="12" r="2.8" />
    @if (visible()) {
      <path d="M4 20 20 4" />
    }
  </svg>
</button>
