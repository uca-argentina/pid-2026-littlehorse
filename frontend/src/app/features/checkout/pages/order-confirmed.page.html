<div class="frame">
  <main class="body">
    <div class="tick" aria-hidden="true">
      <svg
        width="34"
        height="34"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 12.5l5.5 5.5L20 7" />
      </svg>
    </div>

    <h1 class="ttl" role="status">Pedido confirmado</h1>

    <p class="what">Mostrá este código en la barra cuando te llamen.</p>

    <p class="code" data-testid="order-code">{{ code() }}</p>

    <p class="what">
      Ya está pago y esperando en la barra. Te avisamos cuando lo estén preparando.
    </p>

    <!--
      US-12 is the screen this leads to and it does not exist yet. Drawn and
      switched off rather than hidden: a button that appears later moves
      everything under it, and one that leads nowhere reads as a broken app.
    -->
    <button class="cta" type="button" disabled>Ver el estado</button>

    <a class="ghost" [routerLink]="menuLink()">Pedir algo más</a>
  </main>
</div>
