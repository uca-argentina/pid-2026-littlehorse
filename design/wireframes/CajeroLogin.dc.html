<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#12100E;color:#F7F2EA;font-family:'Karla',ui-sans-serif,system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.frame{background:#12100E;display:flex;flex-direction:column;min-height:900px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.grow{flex-grow:1}
.hdr{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid #3A322A}
.mark{width:40px;height:40px;border-radius:12px;background:#E0B65C;color:#12100E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.venue{font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.1}
.station{font-size:13px;color:#B0A69B;letter-spacing:.05em;text-transform:uppercase}
.user{display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:99px;border:1px solid #3A322A;font-size:14.5px;color:#B0A69B}
.tabs{display:flex;gap:10px;padding:14px 24px 0}
.tab{padding:11px 20px;border-radius:11px;font-size:15.5px;font-weight:600;color:#B0A69B;border:1px solid #3A322A}
.tab.on{background:#F7F2EA;color:#12100E;border-color:#F7F2EA;font-weight:700}
.lab{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#B0A69B}

.wrap{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:420px;display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:20px;background:#1E1A16;border:1px solid #3A322A}
.brand{display:flex;align-items:center;gap:13px}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:14.5px;color:#B0A69B}
.field{display:flex;flex-direction:column;gap:8px}
.in{min-height:58px;display:flex;align-items:center;gap:11px;padding:0 17px;border-radius:14px;background:#12100E;border:1px solid #3A322A;font-size:16.5px}
.in.on{border-color:#E0B65C}
.ph{color:#8A8078}
.dots{letter-spacing:.3em;font-size:19px}
.cta{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;background:#E0B65C;color:#12100E;font-weight:700;font-size:17px;margin-top:4px}
.foot{font-size:13.5px;color:#8A8078;line-height:1.55;padding-top:4px;border-top:1px solid #332C24;margin-top:4px}

</style>
</helmet>
<div class="frame">
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14l-7 8z"/><path d="M12 12v7"/><path d="M8.5 19.5h7"/></svg></div>
        <div>
          <div class="venue">[Nombre del boliche]</div>
          <div class="station">Personal</div>
        </div>
      </div>
      <div>
        <div class="h1">Iniciá tu turno</div>
        <div class="sub">Caja 1 · terminal de cobro</div>
      </div>
      <div class="field"><div class="lab">Usuario</div><div class="in on"><span>laura.g</span></div></div>
      <div class="field"><div class="lab">PIN</div><div class="in"><span class="dots ph">••••</span></div></div>
      <div class="cta">Entrar</div>
      <div class="foot">Tu rol sale del token, nunca de la dirección: un bartender no puede ver la caja cambiando la URL, ni un cajero los pedidos de otro boliche.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
