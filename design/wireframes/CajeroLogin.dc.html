<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f2ee;color:#2b2b2b;line-height:1.4}
.hand{font-family:'Kalam',ui-sans-serif,system-ui,cursive}

.in{border:1.6px solid #8a8a8a;border-radius:6px;background:#fff;padding:12px;color:#6b6b6b;font-size:13px}
label{font-size:11px;color:#6b6b6b;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.col{display:flex;flex-direction:column;gap:6px}
.muted{color:#6b6b6b;font-size:13px}
.note{font-family:'Kalam',ui-sans-serif,cursive;color:#3f6ea5;font-size:13px;line-height:1.4}
a{color:#3f6ea5}a:hover{color:#2c4c73}
</style>
</helmet>
<div class="frame" style="width:1440px;min-height:860px">

    <div>
      <div class="hand" style="font-size:22px;font-weight:700">drink.it · Personal</div>
      <div class="muted">Iniciá sesión para operar la caja</div>
    </div>
    <div class="col"><label>Usuario</label><div class="in">cajero.laura</div></div>
    <div class="col"><label>PIN</label><div class="in">••••</div></div>
    <div class="btn">Ingresar</div>
    <div class="note">El rol (Cashier / Bartender / Waiter / Admin) sale del claim del token, nunca de la URL ni de un parámetro que mande el cliente. El mozo usa este mismo login (usuario/PIN) desde su celular.</div>
  </div>
</div>
