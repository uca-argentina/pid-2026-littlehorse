<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f2ee;color:#2b2b2b;line-height:1.4}
.hand{font-family:'Kalam',ui-sans-serif,system-ui,cursive}
.frame{background:#f4f2ee}
.scr{display:flex;flex-direction:column;gap:14px;padding:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:2px solid #2b2b2b}
.h{font-family:'Kalam',ui-sans-serif,cursive;font-weight:700;font-size:22px;margin:0}
.box{border:1.6px dashed #8a8a8a;border-radius:6px;background:#eae7e1;padding:12px}
.btn{border:1.8px solid #2b2b2b;border-radius:6px;padding:13px 14px;text-align:center;font-weight:700;background:#fff;font-family:inherit;font-size:14px}
.btn.p{background:#3f6ea5;color:#fff;border-color:#3f6ea5}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:#6b6b6b;font-size:13px}
.note{font-family:'Kalam',ui-sans-serif,cursive;color:#3f6ea5;font-size:13.5px;line-height:1.4}
.grow{flex-grow:1}
.pill{border:1.5px solid #2b2b2b;border-radius:999px;padding:6px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.step{border:1.6px solid #2b2b2b;border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#fff}
a{color:#3f6ea5}a:hover{color:#2c4c73}
</style>
</helmet>
<div class="frame" style="width:390px;min-height:860px">
  <div class="scr">
    <div class="bar">
      <div class="row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        <div class="h">Tu pedido</div>
      </div>
      <div class="pill">3 ítems</div>
    </div>

    <div class="col">
      <div class="box col">
        <div class="row"><div class="grow" style="font-weight:700">Gin Tonic</div><div>$ [PRECIO]</div></div>
        <div class="row">
          <div class="step">–</div><div class="step" style="border-style:dashed">2</div><div class="step">+</div>
          <div class="grow"></div><a href="#">Quitar</a>
        </div>
        <div class="box" style="background:#fff;padding:9px">Nota: sin hielo</div>
      </div>
      <div class="box col">
        <div class="row"><div class="grow" style="font-weight:700">Fernet con Coca</div><div>$ [PRECIO]</div></div>
        <div class="row">
          <div class="step">–</div><div class="step" style="border-style:dashed">1</div><div class="step">+</div>
          <div class="grow"></div><a href="#">Quitar</a>
        </div>
        <div class="box" style="background:#fff;padding:9px;color:#6b6b6b">Nota: —</div>
      </div>
    </div>

    <div class="btn">+ Agregar más tragos</div>

    <div class="box col">
      <div class="row"><div class="grow muted">Subtotal</div><div>$ [ ]</div></div>
      <div class="row"><div class="grow hand" style="font-size:18px;font-weight:700">Total</div><div class="hand" style="font-size:18px;font-weight:700">$ [TOTAL]</div></div>
    </div>

    <div class="grow"></div>
    <div class="btn p">Ir a pagar</div>
    <div class="note">El pedido es un Order en estado Cart hasta el checkout. Cada línea es un OrderItem (trago + cantidad + notas, §14).</div>
  </div>
</div>
</x-dc>
</body>
</html>
