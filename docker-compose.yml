# Local development database. Not used in Azure: production runs on Azure SQL
# (see docs/adr/0007-hosting-en-azure-a-costo-cero.md).
#
#   docker compose up -d
#
# The password below is NOT a secret. It only ever protects a throwaway
# container on a developer laptop.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: drinkit-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DrinkIt!Local1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - drinkit-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  drinkit-sql-data:
